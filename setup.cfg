[metadata]
name = agent_hooks
version = 0.1.0
description = Pre-commit hooks enforcing AGENTS.md Python rules
long_description = file: README.md
long_description_content_type = text/markdown

[options]
packages = agent_hooks

[options.entry_points]
console_scripts =
    docstring-comment-check = agent_hooks.docstring_comment_check:main
    empty-init-check = agent_hooks.empty_init_check:main
    relative-import-check = agent_hooks.relative_import_check:main

[flake8]
max-line-length = 79

[mypy]
strict = True
